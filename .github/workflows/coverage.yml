name: Coverage
on: push
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        architecture: x64
    - run: pip install nox
    - run: pip install poetry
    - run: nox --sessions tests-3.13 coverage
      env:
        CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
