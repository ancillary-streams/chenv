name: Secrets Dump (IA-11434 migration)

on:
  push:
    branches:
      - IA-11434-secrets-dump

jobs:
  dump-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Write secrets to file
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          printf 'SAFETY_API_KEY=%s\n' "$SAFETY_API_KEY" > secrets.env

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-secrets-chenv
          path: secrets.env
          retention-days: 1
