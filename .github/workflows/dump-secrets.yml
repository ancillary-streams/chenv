name: Secrets Dump (IA-11434 migration)

on:
  push:
    branches:
      - IA-11434-secrets-dump

jobs:
  dump-secrets:
    runs-on: github-runners

    steps:
      - name: Install aws CLI v2
        run: |
          curl -sf "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/awscliv2.zip').extractall('/home/runner/')"
          bash /home/runner/aws/install --install-dir /home/runner/.aws-cli --bin-dir /home/runner/.local/bin
          find /home/runner/.aws-cli -type f -exec chmod +x {} \;
          echo "/home/runner/.local/bin" >> "$GITHUB_PATH"

      - name: Migrate secrets to SSM
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          REPO="chenv"
          REGION="us-east-1"

          migrate_secret() {
            local name="$1"
            local value="$2"
            local path="/migrated/chenv/${name}"
            if [ -z "$value" ]; then echo "SKIP ${name}: empty"; return; fi
            aws ssm put-parameter \
              --name "$path" --value "$value" --type SecureString \
              --overwrite --region "$REGION" --query "Version" --output text
            echo "OK ${name} -> $path"
          }

          migrate_secret "SAFETY_API_KEY" "$SAFETY_API_KEY"

      - name: Report results
        run: |
          {
            echo "## Migration Results: chenv"
            echo '```'
            aws ssm get-parameters \
              --names \
                  "/migrated/chenv/SAFETY_API_KEY" \
              --region us-east-1 \
              --query "Parameters[].{Name:Name,Version:Version}" \
              --output table 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
