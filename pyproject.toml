[tool.poetry]
name = "chenv"
version = "0.4.2"
description = "modern local environment management"
authors = ["Jonathan Shemer <i@jonathanshemer.com>"]
license = "MIT"
readme = "README.rst"
homepage = "https://github.com/jonathan-shemer/chenv"
repository = "https://github.com/jonathan-shemer/chenv"
documentation = "https://chenv.readthedocs.io"
keywords = ["chenv", "dotenv", "enviroment"]

[tool.poetry.dependencies]
python = ">=3.8,<3.15"
click = "^8.1.8"
marshmallow = "^3.23.2"
desert = "^2020.11.18"
python-dotenv = "^1.0.1"
httpx = "^0.28.1"
toolz = "^1.0.0"
questionary = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
flake8 = "^7.1.1"
black = "^25.1.0"
flake8-black = "^0.3.6"
flake8-import-order = "^0.18.2"
flake8-bugbear = "^25.1.7"
flake8-bandit = "^4.1.1"
safety = "^3.3.1"
mypy = "^1.14.1"
typeguard = "^4.4.1"
flake8-docstrings = "^1.7.0"
darglint = "^1.8.1"
xdoctest = "^1.2.0"
sphinx = "^8.1.3"
sphinx-autodoc-typehints = "^2.5.0"
codecov = "^2.1.13"
pylint = "^3.3.3"
flake8-annotations = "^3.1.1"
coverage = "^7.6.10"

[tool.poetry.scripts]
chenv = "chenv.main:main"

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313', 'py314']

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
